name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (static export)
        run: npm run build

      - name: Archive integrity
        # Verifies SHA-1 of every preserved asset against the manifest.
        # Passes trivially while the archive is empty; becomes a real
        # gate as soon as recovered content lands.
        run: npm run pipeline:verify
